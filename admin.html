<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Auto Service — Ադմին</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<script src="/static/leaflet/leaflet.js"></script>
<style>
/* Դիզայն. բաց ֆոն, սպիտակ կողային նավիգացիա, կանաչ շեշտ (canvas «AI Auto Service — նոր դիզայն», «Ադմին պանել» artboard-ները և «Ոճի ուղեցույց»-ը) */
:root{--bg:#F4F6F5;--surface:#FFFFFF;--line:#E4E8E6;--line2:#EEF1EF;--line3:#DDE2DF;--ink:#16201B;--ink2:#3C4742;--mute:#5B6660;--dim:#8A948F;--empty:#C9D1CC;
  --acc:#0E7C53;--acc2:#0B6643;--soft:#E3F5EB;--okdot:#1DA462;--star:#D98E04;--starbg:#FFF4E0;--warnink:#8A5A00;--warnline:#F0C97A;
  --bad:#B42318;--badbg:#FEF3F2;--badline:#F3C4C4;--blue:#1D4ED8;--bluebg:#E8EEFF;--blueline:#C7D2FE;--mapbg:#E8EDEA;
  --sh1:0 1px 2px rgba(16,24,40,.04);--sh2:0 8px 24px rgba(16,24,40,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--font:Inter,"Noto Sans Armenian",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
.hide{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{color:var(--acc2)}
button,input,select,textarea{font:inherit;color:inherit}
input::placeholder{color:var(--dim)}
.ico{width:18px;height:18px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---- մուտք ---- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 24px}
#login .lbox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--sh2)}
#login h1{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
#login .lead{margin:8px 0 0}
#login .back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}#login .back:hover{color:var(--ink)}
#login .back .ico{width:14px;height:14px}
.ver{font-size:12px;color:var(--dim)}
.pwwrap{display:flex;align-items:center;height:46px;padding:0 6px 0 14px;border-radius:12px;border:1px solid var(--line3);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.pwwrap:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
#login .pwwrap input{flex:1 1 auto;min-width:0;height:100%;border:0;border-radius:0;box-shadow:none;outline:0;background:transparent;font-size:15px;padding:0}
.pwwrap .eye{width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.pwwrap .eye:hover{background:var(--bg);color:var(--ink)}

/* ---- բրենդ ---- */
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
#login .logo{width:40px;height:40px;border-radius:12px}#login .logo svg{width:20px;height:20px}
.brand .ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
#login .brand b{font-size:15px}
.brand .sub2{font-size:12px;color:var(--mute);white-space:nowrap}

/* ---- կարկաս ---- */
#app{min-height:100dvh;display:flex;align-items:stretch}
aside{flex:none;width:280px;display:flex;flex-direction:column;gap:6px;padding:20px 12px;padding-top:max(20px,env(safe-area-inset-top));background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow-y:auto}
aside .brand{padding:6px 10px 18px}
nav#tabs{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:500;text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:var(--soft);color:var(--acc);font-weight:600}
.nav .lbl{flex:1}
.nbadge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--line2);color:var(--ink2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.side-foot .me{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
.side-foot .me b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .ver{font-size:11px}
.iconbtn{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
main{flex:1;min-width:0;padding:32px clamp(16px,3vw,40px) 48px;display:flex;flex-direction:column;gap:20px}

/* ---- էջի գլուխ ---- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.ph>div:first-child{display:flex;flex-direction:column;gap:6px;max-width:680px}
h2{margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.sub{margin:0;font-size:14px;line-height:1.5;color:var(--mute);text-wrap:pretty}
h3{margin:0;font-size:16px;font-weight:600}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.crumbs .sep{color:var(--empty);flex:none}
.crumbs b{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line3);width:300px;max-width:100%;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.search .ico{width:16px;height:16px;color:var(--mute)}
.search input{flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;font-size:14px;padding:0;height:100%}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

/* ---- քարտեր ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);min-width:0}
.card.pad{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.cf{padding:12px 20px;border-top:1px solid var(--line2);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cf p{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:14px}
.card.stat{border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card.stat span{font-size:12px;font-weight:500;color:var(--mute);line-height:1.4}
.card.stat b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card.stat b.ok{color:var(--acc)}.card.stat b.warn{color:var(--warnink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:20px;align-items:start}
.hl{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--soft);border:1px solid color-mix(in oklab,var(--acc) 25%,white)}
.hl>div,.tgl>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.hl b,.tgbox b{font-size:14px;font-weight:600}
.hl .note{color:var(--ink2)}
.ic{flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center}
.ic.g{background:var(--line2);color:var(--ink2)}
.ic.on{background:var(--soft);color:var(--acc)}
.ic svg{width:18px;height:18px}
.tgbox{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.tgbox .tgl{display:flex;gap:14px;align-items:flex-start;flex:1 1 240px;min-width:0}
.tgbox .row{flex:none;align-self:center}
.tgbox .tginfo{flex-basis:100%;padding:10px 14px;border-radius:10px;background:var(--bg)}
.tginfo:empty{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;line-height:1.5;color:var(--mute)}
.fine{font-size:12px;line-height:1.5;color:var(--dim)}
.warn{color:var(--warnink)}
.okmsg{padding:10px 14px;border-radius:10px;background:var(--soft);color:var(--acc2);font-size:13px;line-height:1.5;font-weight:500}
.warnmsg{padding:10px 14px;border-radius:10px;background:var(--starbg);color:var(--warnink);font-size:13px;line-height:1.5;font-weight:500}
.warnmsg.big{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--warnline);font-size:14px;font-weight:400}
.warnmsg.big .ico{color:var(--star);margin-top:1px}
.warnmsg.big b{font-weight:600}
code{font-family:var(--mono);font-size:12px;background:var(--bg);padding:1px 6px;border-radius:6px}

/* ---- դաշտեր ---- */
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.lbl .fine{font-weight:400}
input,select{color:var(--ink);background:var(--surface);border:1px solid var(--line3);border-radius:10px;height:42px;padding:0 12px;min-width:0;width:100%;font-size:14px;font-weight:400;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
#login input{height:46px;border-radius:12px;padding:0 14px;font-size:15px}
select{cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%235B6660' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px}
input[type=number]{width:88px;height:36px;padding:0 10px;border-radius:8px;font-variant-numeric:tabular-nums}
input[type=time]{width:auto;height:36px;padding:0 10px;border-radius:8px}
input[type=month]{width:auto;height:40px;font-weight:600;border:0;border-left:1px solid var(--line2);border-right:1px solid var(--line2);border-radius:0;background:transparent}
input[type=month]:focus{box-shadow:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer;padding:0;height:18px}
input:disabled{background:#F9FAF9;border-color:var(--line2);color:var(--dim)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.monthpick{display:flex;align-items:center;gap:8px}
.monthpick>label{font-size:13px;font-weight:600;color:var(--ink2)}
.monthpick .mp{display:flex;align-items:center;border:1px solid var(--line3);border-radius:10px;background:var(--surface);overflow:hidden}
.monthpick .mp button{width:40px;height:40px;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.monthpick .mp button:hover{background:var(--bg);color:var(--ink)}

/* ---- կոճակներ ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line3);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-size:14px;padding:0 18px}.btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.big{height:48px;border-radius:12px;font-size:15px}
.btn.sm{height:34px;padding:0 12px;border-radius:8px}
.btn.danger{border-color:var(--badline);color:var(--bad)}.btn.danger:hover{background:var(--badbg);color:var(--bad)}
.btn.danger[data-arm]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn .ico{width:16px;height:16px}

/* ---- պիտակներ ---- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--ink2);width:fit-content}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--soft);color:var(--acc2)}.pill.ok::before{background:var(--okdot)}
.pill.warn{background:var(--starbg);color:var(--warnink)}.pill.warn::before{background:var(--star)}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.bad::before{background:var(--bad)}
.pill.plain::before{display:none}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line3);background:var(--surface);color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.fchip:hover{background:var(--bg)}
.fchip.on{border-color:var(--acc);background:var(--soft);color:var(--acc);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line3);background:var(--surface);color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{background:var(--bg)}
.chip.on{border-color:var(--acc);background:var(--soft);color:var(--acc);font-weight:600}
.chip.add{border-style:dashed;color:var(--acc);font-weight:600}.chip.add:hover{border-color:var(--acc);background:var(--soft)}

/* ---- աղյուսակներ ---- */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.new td{background:var(--soft)}
tr.dim{color:var(--dim)}tr.dim strong{color:var(--mute)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .d{display:flex;flex-direction:column;gap:2px;white-space:nowrap}td .d small{font-size:12px;color:var(--mute)}
td .two{display:flex;flex-direction:column;gap:2px}td .two small{font-size:12px;color:var(--mute)}
td a.tel{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
td select{width:200px;max-width:100%;height:36px;padding:0 34px 0 12px;font-size:13px;font-weight:500;border-radius:10px}
td select.unassigned{border-color:var(--warnline);background-color:var(--starbg);color:var(--warnink)}
td .cnt{padding:2px 8px;border-radius:999px;font-weight:600;font-size:12px}
.cnt.acc{background:var(--soft);color:var(--acc)}.cnt.warn{background:var(--starbg);color:var(--warnink)}
/* փուլեր՝ գունավոր պիտակ-select. Նոր — շեշտ, Զանգ — կապույտ, Չպատ. — դեղին, Ժամ/Այց — կանաչ, Հրաժ. — կարմիր */
select.st{font-weight:600}
select.st-new{border-color:var(--acc);color:var(--acc);background-color:var(--surface)}
select.st-called{border-color:var(--blueline);color:var(--blue);background-color:var(--bluebg)}
select.st-no_answer{border-color:var(--warnline);color:var(--warnink);background-color:var(--starbg)}
select.st-booked,select.st-visited{border-color:#BFE3CF;color:var(--acc2);background-color:var(--soft)}
select.st-declined{border-color:var(--badline);color:var(--bad);background-color:var(--badbg)}
select option{background:var(--surface);color:var(--ink);font-weight:400}

/* ---- գարաժների ցանկ ---- */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar .search{flex:1 1 320px;max-width:460px;width:auto;height:44px}
.toolbar select{width:auto;height:40px;font-size:13px}
.avatar.sq{border-radius:9px;width:34px;height:34px;font-size:13px}
.avatar.acc{background:var(--soft);color:var(--acc)}
a.gname{display:flex;align-items:center;gap:10px;color:var(--ink)}a.gname:hover{color:var(--acc)}
.stars.one{display:inline-flex;vertical-align:-2px;margin-right:4px}.stars.one svg{width:13px;height:13px}
.haslogin{display:inline-flex;align-items:center;gap:5px;color:var(--acc2);font-size:13px;font-weight:600}
.glist table{min-width:900px}
.gcards{display:none;flex-direction:column;gap:10px}
.gcard{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-align:left;cursor:pointer;width:100%;font:inherit}
.gcard .avatar.sq{width:42px;height:42px;border-radius:12px;font-size:16px}
.gcard .gc-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.gcard .gc-body strong{font-size:15px;font-weight:600}.gcard .gc-body .note{font-size:12px}
.gcard>svg{color:var(--dim)}
.search.sm{height:34px;padding:0 10px;border-radius:8px;width:200px;gap:8px}.search.sm input{font-size:13px}
.crumbs a{color:var(--mute);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crumbs a:hover{color:var(--acc2)}
.crumbs a.home{flex:none;width:32px;height:32px;margin-left:-6px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--acc)}.crumbs a.home:hover{background:var(--soft);color:var(--acc)}.crumbs a.home .ico{width:18px;height:18px}
tr.today td{background:var(--soft)}tr.today strong{color:var(--acc)}
/* ---- գարաժի էջ ---- */
.ghead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ghead .gl{display:flex;align-items:center;gap:14px;min-width:0}
.gavatar{width:52px;height:52px;border-radius:14px;background:var(--soft);color:var(--acc);font-size:20px;font-weight:700;display:grid;place-items:center;flex:none}
.ghead h3{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.ghead .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:4px}
.gtbl th,.gtbl td{padding:10px 12px}.gtbl th:first-child{padding-left:16px}.gtbl td:first-child{padding-left:16px}
.gtbl th.chk{width:1%}
.loginrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--mute)}
.loginrow b{font-family:var(--mono);color:var(--ink);font-weight:600}
.map{height:300px;border-radius:12px;border:1px solid var(--line3);overflow:hidden;background:var(--mapbg);display:grid;place-items:center;color:var(--mute);font-size:13px}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--acc);border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(16,24,40,.3)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{background:rgba(255,255,255,.85)!important;color:var(--mute)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--acc)!important}
.leaflet-bar a{color:var(--ink)!important}

/* ---- հաշվետվություն ---- */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 96px;align-items:center;gap:14px;font-size:14px}
.track{height:10px;border-radius:999px;background:var(--line2);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--acc)}
.bar .num{text-align:right;color:var(--mute);white-space:nowrap;font-size:13px}

/* ---- կարծիքներ ---- */
.revs{display:flex;flex-direction:column;gap:12px}
.rev{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between;padding:18px 22px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
.rev.off{border-style:dashed;background:transparent;box-shadow:none}
.rev.off .body{opacity:.65}
.rev .body{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.rev .body p{margin:0;font-size:14px;line-height:1.55;color:var(--ink2)}
.rev .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rev .top b{font-size:15px;font-weight:600}
.rev .top span{font-size:13px;color:var(--mute)}
.rev .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.rev .meta a{font-weight:600}
.rev .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rev .acts select{width:auto;height:38px}
.stars{display:inline-flex;gap:1px;color:var(--star)}
.stars svg{width:16px;height:16px;fill:currentColor}
.stars svg.o{color:var(--empty)}
.emptybox{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 20px;border-radius:16px;border:1px dashed #D5DBD8;text-align:center}
.emptybox .stars{color:var(--empty)}
.emptybox b{font-size:14px;font-weight:500;color:var(--ink2)}
.emptybox span{font-size:13px;color:var(--mute)}

/* ---- այլ ---- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:1000;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--sh2)}
#toast.show{opacity:1}#toast.err{background:var(--bad)}

/* ---- բջջային. նավիգացիան ներքևի ներդիրներ է (MA- artboard-ներ) ---- */
@media(max-width:800px){
  #app{flex-direction:column}
  aside{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  aside .brand{flex:1;padding:0}
  .brand .sub2{display:none}
  .side-foot{margin:0;padding:0;border:0;gap:8px}
  .side-foot .me{display:none}
  .side-foot .iconbtn{border:1px solid var(--line);border-radius:10px;width:40px;height:40px}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;flex-direction:row;gap:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px max(8px,env(safe-area-inset-bottom))}
  .nav{flex:1 1 0;flex-direction:column;justify-content:center;gap:4px;height:auto;padding:6px 0;border-radius:12px;font-size:10px;font-weight:500;background:transparent;min-width:0}
  .nav:hover,.nav.on{background:transparent}
  .nav .ico{width:44px;height:28px;border-radius:999px;padding:5px 0}
  .nav.on .ico{background:var(--soft)}
  .nav .lbl{display:none}
  .nav::after{content:attr(data-short);max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .nbadge{position:absolute;margin-left:28px;margin-top:-38px;min-width:18px;height:18px;font-size:10px}
  body{padding-bottom:76px}
  main{padding:16px 16px 32px;gap:16px}
  h2{font-size:22px}
  .ghead h3{font-size:20px}
  .gavatar{width:42px;height:42px;font-size:16px;border-radius:12px}
  .card.pad{padding:16px}
  .ch,.cf{padding:12px 16px}
  th,td{padding:10px 12px}
  .rev{padding:16px}
  .bar{grid-template-columns:minmax(0,1fr) 72px;row-gap:6px}
  .bar .track{grid-column:1/-1}
  .map{height:220px}
  .search{width:100%}
  .glist{display:none}.gcards{display:flex}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card.stat{padding:12px 14px}.card.stat b{font-size:22px}
  .toolbar .search{max-width:none}
  .search.sm{width:100%}
}
</style>
</head>
<body>
<div id="login" class="hide">
  <form class="lbox" id="lform">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span class="ttl"><b>AI Auto Service</b><span class="sub2">Ադմին պանել</span></span></div>
    <div><h1>Մուտք</h1><p class="sub lead">Գարաժի սեփականատերը մուտք է գործում իր մուտքանունով։ Գլխավոր ադմինը թողնում է այն դատարկ։</p></div>
    <label class="lbl">Մուտքանուն<input id="lg" placeholder="Գլխավոր ադմինի համար՝ դատարկ" autocomplete="username"></label>
    <label class="lbl">Գաղտնաբառ<span class="pwwrap"><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" id="pwEye" aria-label="Ցույց տալ գաղտնաբառը"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
    <button class="btn primary big" id="go">Մուտք <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
  </form>
  <a href="/" class="back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Վերադառնալ կայք</a>
  <span class="ver">v__APP_VERSION__</span>
</div>
<div id="app" class="hide">
  <aside>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span><span class="ttl"><b>AI Auto Service</b><span class="sub2">Ադմին պանել</span></span></div>
    <nav id="tabs" aria-label="Պանելի բաժիններ">
      <button class="nav" data-t="requests" data-short="Հայտեր"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-7A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1z"/></svg><span class="lbl">Հայտեր</span><span class="nbadge" id="nbadge" hidden></span></button>
      <button class="nav" data-t="garages" id="tabG" data-short="Գարաժներ"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M7 17h10"/></svg><span class="lbl">Գարաժներ</span></button>
      <button class="nav" data-t="report" data-short="Հաշվետվ."><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14v4M12 9v9M17 12v6"/></svg><span class="lbl">Հաշվետվություն</span></button>
      <button class="nav" data-t="reviews" data-short="Կարծիքներ"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span class="lbl">Կարծիքներ</span></button>
      <button class="nav" data-t="apps" data-short="Հավելված"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg><span class="lbl">Հավելվածներ</span></button>
      <button class="nav" data-t="catalog" id="tabC" data-short="Կատալոգ"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="lbl">Կատալոգ</span></button>
    </nav>
    <div class="side-foot">
      <span class="avatar" id="avi" aria-hidden="true">Ա</span>
      <span class="me"><b id="who"></b></span>
      <button class="iconbtn" id="out" aria-label="Դուրս գալ" title="Դուրս գալ"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
const DAYS=["Երկուշաբթի","Երեքշաբթի","Չորեքշաբթի","Հինգշաբթի","Ուրբաթ","Շաբաթ","Կիրակի"];
let token=sessionStorage.getItem("tok")||"",D=null,tab="requests",gsel=null,rf="all";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;function toast(m,err){const t=$("#toast");t.textContent=m;t.className="show"+(err?" err":"");clearTimeout(tt);tt=setTimeout(()=>t.className="",2600)}

async function api(method,path,body,auth=true){
  const r=await fetch("/admin"+path,{method,headers:{"Content-Type":"application/json",...(auth?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&auth){logout();throw new Error("auth")}
  if(!r.ok){let m="Սխալ "+r.status;try{const j=await r.json();m=typeof j.detail==="string"?j.detail:"Անվավեր տվյալներ"}catch(e){}toast(m,true);throw new Error(m)}
  return r.json();
}
async function refresh(){D=await api("GET","/data");R=null;RV=null}
function armed(btn,label){ // ջնջման երկքայլ հաստատում
  if(btn.dataset.arm)return true;
  btn.dataset.arm=1;btn.textContent="Հաստատել ջնջումը";btn.classList.add("danger");
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=label;btn.classList.remove("danger")}},4000);return false;
}
function logout(){clearInterval(pollT);token="";sessionStorage.removeItem("tok");history.replaceState(null,"",BASE); // դուրս գալիս հասցեն մաքրվում է. հաջորդ մուտքը՝ «Հայտեր»-ից
  $("#app").classList.add("hide");$("#login").classList.remove("hide");$("#pw").focus()}
async function login(){
  try{const d=await api("POST","/login",{login:$("#lg").value.trim(),password:$("#pw").value},false);token=d.token;sessionStorage.setItem("tok",token);$("#pw").value="";await start()}catch(e){}
}
const isAdmin=()=>D&&D.role==="admin";
// ---- URL-ներ. /panel/requests, /panel/garages, /panel/garages/<id>, /panel/report, /panel/reviews, /panel/apps, /panel/catalog ----
const BASE="/panel",TABS=["requests","garages","report","reviews","apps","catalog"];
function route(){ // հասցե → վիճակ (բացելիս, Back/Forward-ին)
  const [t,id]=location.pathname.slice(BASE.length).split("/").filter(Boolean);
  if(!TABS.includes(t)||(t==="catalog"&&!isAdmin())){tab="requests";return}
  tab=t;if(t==="garages")gsel=isAdmin()?(id?+id:null):(D.garages[0]?.id??null);
}
const pathFor=()=>BASE+"/"+tab+(tab==="garages"&&isAdmin()&&gsel!=null?"/"+gsel:"");
function nav(t,id){ // ներդիր/գարաժ բացել. վիճակը, հասցեն պատմության մեջ, հետո նկարելը (render-ը replaceState է անում)
  tab=t;if(t==="garages")gsel=isAdmin()?(id??null):(D.garages[0]?.id??null);
  const h=pathFor();if(location.pathname!==h)history.pushState(null,"",h);
  render();window.scrollTo(0,0);
}
window.addEventListener("popstate",()=>{if(!D)return;route();render()});
async function start(){
  $("#login").classList.add("hide");$("#app").classList.remove("hide");await refresh();
  rf="all";gq="";gf="all";gsort="name";route();
  $("#tabC").classList.toggle("hide",!isAdmin());
  $("#tabG").querySelector(".lbl").textContent=isAdmin()?"Գարաժներ":"Իմ գարաժը";$("#tabG").dataset.short=isAdmin()?"Գարաժներ":"Իմ գարաժը";
  const who=isAdmin()?"Գլխավոր ադմին":(D.garages[0]?.name||"");
  $("#who").textContent=who;$("#avi").textContent=(who.trim()[0]||"Ա").toUpperCase();
  render();
}

function fmtDate(s){return new Date(s.replace(" ","T")+"Z").toLocaleString("en-GB",{timeZone:"Asia/Yerevan",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).replace(/\//g,".")}
function fmtD(s){const [d,t]=fmtDate(s).split(", ");return `<span class="d num"><strong>${d}</strong><small>${t||""}</small></span>`}
const ICO={
  home:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>`,
  tg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/></svg>`,
  bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
  phone:`<svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2z"/></svg>`,
  star:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`,
  search:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`,
  prev:`<svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>`,
  next:`<svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`,
  plus:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  warn:`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>`,
  ext:`<svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>`,
  eyeoff:`<svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 4.2A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>`
};
function tgBox(who,linked){
  if(!D.telegram.enabled)return `<section class="tgbox"><div class="tgl"><span class="ic g">${ICO.tg}</span><div><b>Telegram ծանուցումներ</b><span class="note">Telegram-ը դեռ կարգավորված չէ. գլխավոր ադմինը պետք է ավելացնի <code>TELEGRAM_BOT_TOKEN</code>։</span></div></div></section>`;
  return `<section class="tgbox"><div class="tgl"><span class="ic ${linked?"on":"g"}">${ICO.tg}</span><div><b>Telegram ծանուցումներ</b>
  <span class="note">${linked?"✓ Միացված է. նոր հայտերը կգան Telegram-ով։":"Միացված չէ. նոր հայտերի մասին կիմանաք միայն այս պանելից։"}</span></div></div>
  <div class="row"><button class="btn ${linked?"":"primary"}" data-tglink="${who}">${linked?"Միացնել այլ Telegram":"Միացնել"}</button>${linked?`<button class="btn" data-tgunlink="${who}">Անջատել</button>`:""}</div>

  DRAFT={lat,lng};
  if(!MAP)return;
  if(!MARK){MARK=L.marker([lat,lng],{draggable:true,icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,22]})}).addTo(MAP);
    MARK.on("dragend",()=>{const p=MARK.getLatLng();DRAFT={lat:p.lat,lng:p.lng};$("#locSave").disabled=false;locMsg("Կետը տեղափոխվեց. սեղմեք «Պահպանել կետը»։")})}
  else MARK.setLatLng([lat,lng]);
  MAP.setView([lat,lng],Math.max(MAP.getZoom(),17));
  $("#locSave").disabled=false;if(msg)locMsg(msg);
}
function loadLeafletCDN(){ // պահուստ. եթե /static/leaflet չկա սերվերում, բեռնում ենք cdnjs-ից
  return new Promise(res=>{
    const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";document.head.append(l);
    const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
    s.onload=()=>res(typeof L!=="undefined");s.onerror=()=>res(false);document.head.append(s);
  });
}
async function initMap(){
  if(MAP){MAP.remove();MAP=null;MARK=null}DRAFT=null;
  let el=$("#map");if(!el)return;
  if(typeof L==="undefined"){el.textContent="Քարտեզը բեռնվում է…";await loadLeafletCDN();el=$("#map");if(!el)return}
  if(typeof L==="undefined"){el.textContent="Քարտեզը չբեռնվեց։";return}
  el.textContent="";el.style.display="block";
  const g=curG();
  MAP=L.map(el).setView(g&&g.lat!=null?[g.lat,g.lng]:[40.1792,44.4991],g&&g.lat!=null?17:12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(MAP);
  if(g&&g.lat!=null){setDraft(g.lat,g.lng);$("#locSave").disabled=true}
  MAP.on("click",e=>setDraft(e.latlng.lat,e.latlng.lng,"Կետը նշված է. սեղմեք «Պահպանել կետը»։"));
}
const kw=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
const curG=()=>D.garages.find(x=>x.id===gsel);

$("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)nav(b.dataset.t)};
$("#out").onclick=logout;$("#lform").onsubmit=e=>{e.preventDefault();login()}; // Enter-ը և «Մուտք» կոճակը նույն submit-ն են՝ մեկ հարցում
$("#pwEye").onclick=()=>{const p=$("#pw"),show=p.type==="password";p.type=show?"text":"password";$("#pwEye").setAttribute("aria-label",show?"Թաքցնել գաղտնաբառը":"Ցույց տալ գաղտնաբառը")};

$("#main").oninput=e=>{ // հայտերի որոնում՝ առանց վերագծելու
  if(e.target.id==="rs"){const q=e.target.value.trim().toLowerCase();document.querySelectorAll("tr[data-rid]").forEach(tr=>tr.hidden=!!q&&!tr.dataset.q.includes(q))}
  if(e.target.id==="gs"){gq=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll("[data-gid]").forEach(el=>{el.hidden=!!gq&&!el.dataset.q.includes(gq);if(!el.hidden&&el.tagName==="TR")n++});const c=$("#gcount");if(c)c.textContent=`Ցուցադրվում է ${n} · ${D.garages.length}-ից`}
  if(e.target.id==="ss"){const q=e.target.value.trim().toLowerCase();document.querySelectorAll("tr[data-sq]").forEach(tr=>tr.hidden=!!q&&!tr.dataset.sq.includes(q))}
};
$("#main").onclick=async e=>{
  const t=e.target.closest("button,[data-g],[data-back],[data-home]")||e.target,d=t.dataset;
  if(d.g||d.back||d.home)e.preventDefault();
  try{
    if(d.home){nav("requests")}
    else if(d.back){nav("garages")}
    else if(d.rf){rf=d.rf;render()}
    else if(d.hide){const sel=document.querySelector(`[data-hr="${d.hide}"]`);if(!sel.value){toast("Ընտրեք թաքցնելու պատճառը",true);return}
      await api("PATCH","/reviews/"+d.hide,{hidden:true,reason:sel.value});RV=null;render();toast("Կարծիքը թաքցվեց")}
    else if(d.unhide){await api("PATCH","/reviews/"+d.unhide,{hidden:false});RV=null;render();toast("Կարծիքը վերականգնվեց")}
    else if(d.req){await api("PATCH","/requests/"+d.req,{status:d.to});await refresh();render()}
    else if(d.g){nav("garages",+d.g)}
    else if(d.tglink){
      const r=await api("POST",d.tglink==="admin"?"/telegram/link":`/garages/${gsel}/telegram/link`);
      const box=$("#tgInfo-"+d.tglink);
      box.innerHTML=(r.url?`1) <a href="${esc(r.url)}" target="_blank" rel="noopener">Բացել Telegram բոտը</a> և սեղմել <b>Start</b>։<br>`:`1) Բացեք բոտը Telegram-ում և ուղարկեք՝ <b>${esc(r.command)}</b><br>`)+
        `Եթե հղումը չի աշխատում, բոտին ուղարկեք՝ <b>${esc(r.command)}</b><br>2) Այս էջը ինքն է կթարմացվի (կոդը վավեր է 1 ժամ)։`;
      watchLink();
    }
    else if(d.tgunlink){await api("DELETE",d.tgunlink==="admin"?"/telegram":`/garages/${gsel}/telegram`);await refresh();render();toast("Telegram-ը անջատվեց")}
    else if(t.id==="rmPrev"){shiftMonth(-1)}
    else if(t.id==="rmNext"){shiftMonth(1)}
    else if(t.id==="saveAcc"){
      const pw=$("#ap").value;if(!$("#al").value.trim()||!pw){toast("Լրացրեք մուտքանունը և գաղտնաբառը",true);return}
      await api("PUT",`/garages/${gsel}/account`,{login:$("#al").value.trim(),password:pw});await refresh();render();toast("Մուտքը պահպանվեց")}
    else if(t.id==="delAcc"){if(armed(t,"Հանել մուտքը")){await api("DELETE",`/garages/${gsel}/account`);await refresh();render();toast("Մուտքը հանվեց")}}
    else if(t.id==="addG"){const r=await api("POST","/garages",{name:"Նոր գարաժ"});await refresh();nav("garages",r.id);toast("Գարաժը ավելացվեց")}
    else if(t.id==="locHere"){
      if(!navigator.geolocation){toast("Դիտարկիչը տեղորոշում չի աջակցում",true);return}
      locMsg("Տեղորոշվում է…");
      navigator.geolocation.getCurrentPosition(p=>{const a=Math.round(p.coords.accuracy);
        setDraft(p.coords.latitude,p.coords.longitude,`Ձեր տեղը գտնվեց (±${a} մ). ստուգեք քարտեզին և քաշեք կետը մուտքի վրա, ապա պահպանեք։`+(a>100?" Ճշտությունը ցածր է։":""));
        if(a>100)locMsg(`Ճշտությունը ցածր է (±${a} մ). ուղղեք կետը ձեռքով, ապա պահպանեք։`,true)},
        err=>locMsg("Տեղորոշումը չհաջողվեց (թույլտվություն չկա կամ GPS-ը անջատված է). նշեք կետը քարտեզին ձեռքով։",true),{enableHighAccuracy:true,timeout:15000});
    }
    else if(t.id==="locFind"){
      const qy=$("#ga").value.trim();if(qy.length<3){toast("Նախ գրեք հասցեն",true);return}
      locMsg("Որոնվում է…");
      const r=await api("POST","/geocode",{query:qy.toLowerCase().includes("հայաստան")||qy.toLowerCase().includes("armenia")?qy:qy+", Հայաստան"});
      if(r.found)setDraft(r.lat,r.lng,"Գտնվեց մոտավոր կետ. ՍՏՈՒԳԵՔ քարտեզին, անհրաժեշտության դեպքում քաշեք մուտքի վրա, ապա սեղմեք «Պահպանել կետը»։");
      else locMsg("Հասցեն չգտնվեց. նշեք կետը քարտեզին ձեռքով։",true);
    }
    else if(t.id==="locSave"){
      if(!DRAFT)return;const g=curG();
      if($("#ga").value.trim()!==(g.address||"").trim())  // նախ պահպանում ենք նոր հասցեն (այն հանում է հին կետը), հետո՝ նոր կետը
        await api("PUT","/garages/"+gsel,{name:$("#gn").value.trim()||"Անանուն",address:$("#ga").value,phone:$("#gp").value});
      await api("PUT",`/garages/${gsel}/location`,{lat:DRAFT.lat,lng:DRAFT.lng});await refresh();render();toast("Կետը պահպանվեց");
    }
    else if(t.id==="locClear"){await api("DELETE",`/garages/${gsel}/location`);await refresh();render();toast("Կետը հանվեց")}
    else if(t.id==="saveG"){await api("PUT","/garages/"+gsel,{name:$("#gn").value.trim()||"Անանուն",address:$("#ga").value,phone:$("#gp").value});await refresh();render();toast("Պահպանվեց")}
    else if(t.id==="delG"){if(armed(t,"Ջնջել գարաժը")){await api("DELETE","/garages/"+gsel);gsel=null;await refresh();render();toast("Գարաժը ջնջվեց")}}
    else if(t.id==="saveH"){
      const days=[];for(let i=0;i<7;i++)if(document.querySelector(`[data-ho="${i}"]`).checked)days.push({weekday:i,open:document.querySelector(`[data-hf="${i}"]`).value,close:document.querySelector(`[data-ht="${i}"]`).value});
      await api("PUT",`/garages/${gsel}/hours`,{days});await refresh();toast("Ժամերը պահպանվեցին")}
    else if(t.id==="addC"){const n=$("#cn").value.trim();if(!n){$("#cn").focus();return}await api("POST","/services",{name:n,category:$("#cc").value.trim()||"Այլ",keywords:kw($("#ck").value),sample_question:$("#cq").value.trim()});await refresh();render();toast("Ծառայությունը ավելացվեց")}
    else if(d.savs){const tr=t.closest("tr");await api("PUT","/services/"+d.savs,{name:tr.querySelector('[data-f=n]').value.trim(),category:tr.querySelector('[data-f=c]').value.trim()||"Այլ",keywords:kw(tr.querySelector('[data-f=k]').value),sample_question:tr.querySelector('[data-f=q]').value.trim()});await refresh();toast("Պահպանվեց")}
    else if(d.dels){if(armed(t,"Ջնջել")){await api("DELETE","/services/"+d.dels);await refresh();render();toast("Ծառայությունը ջնջվեց")}}
  }catch(err){}
};
$("#main").onchange=async e=>{
  const t=e.target,d=t.dataset,g=curG();
  if(t.id==="rm"){rmonth=t.value||rmonth;R=null;render();return}
  if(t.id==="gf"){gf=t.value;render();return}
  if(t.id==="gsort"){gsort=t.value;render();return}
  if(d.stage){
    const rs=document.querySelector(`[data-reason="${d.stage}"]`);
    t.className="st st-"+t.value;
    if(t.value==="declined"){rs.classList.remove("hide");rs.focus();toast("Ընտրեք հրաժարման պատճառը");return}
    rs.classList.add("hide");
    try{await api("PATCH","/requests/"+d.stage,{status:t.value});await refresh();render();toast("Փուլը պահպանվեց")}catch(err){}return}
  if(d.reason){if(!t.value)return;try{await api("PATCH","/requests/"+d.reason,{status:"declined",decline_reason:t.value});await refresh();render();toast("Փուլը պահպանվեց")}catch(err){}return}
  if(d.assign){t.classList.toggle("unassigned",!t.value);try{await api("PUT",`/requests/${d.assign}/garage`,{garage_id:t.value?+t.value:null});await refresh();toast(t.value?"Հայտը նշանակվեց գարաժին":"Նշանակումը հանվեց")}catch(err){}return}
  if(!g)return;
  try{
    if(d.on){
      const p=document.querySelector(`[data-price="${d.on}"]`),u=document.querySelector(`[data-dur="${d.on}"]`),tr=t.closest("tr");
      if(t.checked){p.disabled=u.disabled=false;tr.classList.remove("dim");p.focus();toast("Մուտքագրեք գինը")}
      else{await api("DELETE",`/garages/${g.id}/services/${d.on}`);p.value="";p.disabled=u.disabled=true;tr.classList.add("dim");await refresh();toast("Ծառայությունը հանվեց")}
    }else if(d.price||d.dur){
      const sid=d.price||d.dur,p=document.querySelector(`[data-price="${sid}"]`),u=document.querySelector(`[data-dur="${sid}"]`);
      if(p.value==="")return;
      await api("PUT",`/garages/${g.id}/services/${sid}`,{price:+p.value,duration_min:+u.value||60});await refresh();toast("Գինը պահպանվեց");
    }else if(d.ho!==undefined){const tr=t.closest("tr");tr.classList.toggle("dim",!t.checked);tr.querySelectorAll("input[type=time]").forEach(i=>i.disabled=!t.checked)}
  }catch(err){}
};
let pollT;
function watchLink(){ // Telegram-ի կապի կարգավիճակի թարմացում, մինչև միանա
  clearInterval(pollT);let n=0;const snap=()=>D.telegram.admin_linked+"|"+D.garages.map(g=>g.telegram_linked).join();const was=snap();
  pollT=setInterval(async()=>{n++;try{await refresh()}catch(e){clearInterval(pollT);return}
    if(snap()!==was){clearInterval(pollT);render();toast("Telegram-ը միացավ ✓")}else if(n>=40)clearInterval(pollT)},3000);
}
if(token)start().catch(()=>logout());else logout();
