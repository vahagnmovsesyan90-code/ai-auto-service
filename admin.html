<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Auto Service — Ադմին</title>
<style>
:root{--bg:#e9ebec;--panel:#fff;--ink:#1d2529;--mute:#5d6a71;--line:#cfd5d8;--acc:#1f5fbf;--accink:#fff;--bad:#c0392b;--ok:#1b7a4b}
@media(prefers-color-scheme:dark){:root{--bg:#171c1f;--panel:#222a2e;--ink:#eef1f2;--mute:#9aa7ad;--line:#38434a;--acc:#5b9bff;--accink:#0b1a30;--bad:#ff7b6b;--ok:#4cc58a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Armenian","Segoe UI",system-ui,sans-serif}
.hide{display:none!important}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--ink);color:var(--bg)}
header b{border-left:6px solid #f2b705;padding-left:10px;margin-right:8px}
header nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
header button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:0;padding:6px 12px;border-radius:6px;opacity:.75}
header button.on{background:#f2b705;color:#1d2529;opacity:1;font-weight:600}
main{padding:20px;max-width:980px;margin:0 auto}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);margin:0 0 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input[type=number]{width:110px}input[type=time]{width:140px}input[type=checkbox]{width:18px;height:18px}
.btn{font:inherit;cursor:pointer;background:var(--acc);color:var(--accink);border:0;border-radius:6px;padding:8px 14px;font-weight:600}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mute);font-size:13px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 14px}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.badge{font-size:12px;padding:2px 10px;border-radius:10px;background:#f2b705;color:#1d2529}.badge.done{background:var(--line);color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card b{display:block;font-size:26px;line-height:1.2}.card span{font-size:13px;color:var(--mute)}
td select{max-width:190px}
@media(max-width:700px){header{padding:10px 14px}header nav{order:3;flex:1 1 100%}main{padding:14px}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
#login{max-width:340px;margin:12vh auto;padding:0 20px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="login" class="hide">
  <div class="box"><h2>Մուտք</h2><p class="sub">Գարաժի սեփականատերը մուտքագրում է իր մուտքանունը։ Գլխավոր ադմինը թողնում է այն դատարկ։</p>
  <div class="row" style="flex-direction:column;align-items:stretch">
  <input id="lg" placeholder="Մուտքանուն (գլխավոր ադմինի համար՝ դատարկ)" autocomplete="username">
  <input id="pw" type="password" placeholder="Գաղտնաբառ" autocomplete="current-password">
  <button class="btn" id="go">Մուտք</button></div></div>
</div>
<div id="app" class="hide">
  <header><b>AI Auto Service</b>
    <nav id="tabs"><button data-t="requests">Հայտեր</button><button data-t="garages" id="tabG">Գարաժներ</button><button data-t="report">Հաշվետվություն</button><button data-t="catalog" id="tabC">Կատալոգ</button></nav>
    <span id="who" class="note" style="color:inherit;opacity:.7"></span><button id="out">Դուրս գալ</button></header>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script>
const DAYS=["Երկուշաբթի","Երեքշաբթի","Չորեքշաբթի","Հինգշաբթի","Ուրբաթ","Շաբաթ","Կիրակի"];
let token=sessionStorage.getItem("tok")||"",D=null,tab="requests",gsel=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;function toast(m,err){const t=$("#toast");t.textContent=m;t.className="show"+(err?" err":"");clearTimeout(tt);tt=setTimeout(()=>t.className="",2600)}

async function api(method,path,body,auth=true){
  const r=await fetch("/admin"+path,{method,headers:{"Content-Type":"application/json",...(auth?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});
  if(r.status===401&&auth){logout();throw new Error("auth")}
  if(!r.ok){let m="Սխալ "+r.status;try{const j=await r.json();m=typeof j.detail==="string"?j.detail:"Անվավեր տվյալներ"}catch(e){}toast(m,true);throw new Error(m)}
  return r.json();
}
async function refresh(){D=await api("GET","/data");R=null}
function armed(btn,label){ // ջնջման երկքայլ հաստատում
  if(btn.dataset.arm)return true;
  btn.dataset.arm=1;btn.textContent="Հաստատել ջնջումը";btn.classList.add("danger");
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=label;btn.classList.remove("danger")}},4000);return false;
}
function logout(){clearInterval(pollT);token="";sessionStorage.removeItem("tok");$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#pw").focus()}
async function login(){
  try{const d=await api("POST","/login",{login:$("#lg").value.trim(),password:$("#pw").value},false);token=d.token;sessionStorage.setItem("tok",token);$("#pw").value="";await start()}catch(e){}
}
const isAdmin=()=>D&&D.role==="admin";
async function start(){
  $("#login").classList.add("hide");$("#app").classList.remove("hide");await refresh();
  tab="requests";gsel=D.garages[0]?.id??null;
  $("#tabC").classList.toggle("hide",!isAdmin());
  $("#tabG").textContent=isAdmin()?"Գարաժներ":"Իմ գարաժը";
  $("#who").textContent=isAdmin()?"Գլխավոր ադմին":(D.garages[0]?.name||"");
  render();
}

function fmtDate(s){return new Date(s.replace(" ","T")+"Z").toLocaleString("en-GB",{timeZone:"Asia/Yerevan",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})}
function tgBox(who,linked){
  if(!D.telegram.enabled)return `<div class="box"><b>Telegram ծանուցումներ</b><p class="note">Telegram-ը դեռ կարգավորված չէ. գլխավոր ադմինը պետք է ավելացնի TELEGRAM_BOT_TOKEN։</p></div>`;
  return `<div class="box"><b>Telegram ծանուցումներ</b>
  <p class="note">${linked?"✓ Միացված է. նոր հայտերը կգան Telegram-ով։":"Միացված չէ. նոր հայտերի մասին կիմանաք միայն այս պանելից։"}</p>
  <div class="row"><button class="btn" data-tglink="${who}">${linked?"Միացնել այլ Telegram":"Միացնել Telegram"}</button>${linked?`<button class="btn g" data-tgunlink="${who}">Անջատել</button>`:""}</div>
  <div id="tgInfo-${who}" class="note" style="margin-top:10px"></div></div>`;
}
const STAGES={new:"Նոր",called:"Զանգահարվել է",no_answer:"Չպատասխանեց",booked:"Ժամ պայմանավորվեց",visited:"Այցելեց",declined:"Հրաժարվեց"};
const REASONS={price:"Թանկ է",far:"Հեռու է",other_garage:"Գնաց այլ գարաժ",no_time:"Ժամը չհամապատասխանեց",changed_mind:"Այլևս պետք չէ",other:"Այլ պատճառ"};
const optsOf=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join("");
function requestsView(){
  const n=D.requests.filter(r=>r.status==="new").length,adm=isAdmin();
  const gopts=r=>`<option value="">— նշանակված չէ —</option>`+D.garages.map(g=>`<option value="${g.id}" ${g.id===r.garage_id?"selected":""}>${esc(g.name)}</option>`).join("");
  return `<h2>Հայտեր</h2><p class="sub">Նոր հայտեր՝ ${n}։ Զանգահարեք վարորդին և թարմացրեք փուլը. այսպես հաշվետվությունը ցույց կտա, թե քանի հայտ է հասել այցի։${adm?" Առանց գարաժի հայտերը նշանակեք գարաժի։":""}</p>
  ${adm?tgBox("admin",D.telegram.admin_linked):""}
  <div class="box tbl">${D.requests.length?`<table><tr><th>Ժամանակ</th><th>Անուն</th><th>Հեռախոս</th><th>${adm?"Գարաժ":"Ծառայություն"}</th><th>Նշում</th><th>Փուլ</th></tr>
  ${D.requests.map(r=>`<tr><td>${fmtDate(r.created_at)}</td><td>${esc(r.name)}</td><td><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
  <td>${adm?`<select data-assign="${r.id}" aria-label="Գարաժ">${gopts(r)}</select><div class="note">${esc(r.service||"")}</div>`:esc(r.service||"—")}</td><td>${esc(r.message)}</td>
  <td><select data-stage="${r.id}" aria-label="Փուլ">${optsOf(STAGES,r.status)}</select>
  <select data-reason="${r.id}" aria-label="Հրաժարման պատճառ" class="${r.status==="declined"?"":"hide"}" style="margin-top:6px"><option value="">— պատճառ —</option>${optsOf(REASONS,r.decline_reason)}</select></td></tr>`).join("")}</table>`:`<span class="note">Հայտեր դեռ չկան։</span>`}</div>`;
}
let R=null,rmonth=new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Yerevan"}).slice(0,7);
const pct=(a,b)=>b?Math.round(100*a/b)+"%":"—";
const fmtMin=m=>m==null?"—":m<60?m+" ր":Math.floor(m/60)+" ժ "+(m%60)+" ր";
const card=(v,l)=>`<div class="card"><b>${v}</b><span>${l}</span></div>`;
function reportView(){
  if(!R||R.month!==rmonth){api("GET","/report?month="+rmonth).then(r=>{R=r;render()}).catch(()=>{});return `<h2>Հաշվետվություն</h2><p class="note">Բեռնվում է…</p>`}
  const T=R.total,reasons=Object.entries(T.decline_reasons).sort((a,b)=>b[1]-a[1]);
  return `<h2>Հաշվետվություն</h2><p class="sub">Հայտերը՝ ըստ ստեղծման ամսվա։ Վիճակները ընթացիկն են։</p>
  <div class="row" style="margin-bottom:16px"><input type="month" id="rm" value="${R.month}" aria-label="Ամիս"></div>
  <div class="cards">${card(T.total,"Հայտեր")}${card(pct(T.responded,T.total),"Արձագանքվել է")}${card(pct(T.booked_plus,T.total),"Ժամ պայմանավորվեց")}${card(pct(T.visited,T.total),"Այցելեցին")}${card(fmtMin(T.median_response_min),"Արձագանքման ժամանակ (միջնային)")}</div>
  <div class="box tbl"><table><tr><th>Գարաժ</th><th>Հայտեր</th><th>Նոր</th><th>Զանգ</th><th>Չպատ.</th><th>Ժամ</th><th>Այցելեց</th><th>Հրաժարվեց</th><th>Արձագանք</th><th>Այց</th><th>Ժամանակ</th></tr>
  ${R.garages.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.total}</td><td>${g.new}</td><td>${g.called}</td><td>${g.no_answer}</td><td>${g.booked}</td><td>${g.visited}</td><td>${g.declined}</td><td>${pct(g.responded,g.total)}</td><td>${pct(g.visited,g.total)}</td><td>${fmtMin(g.median_response_min)}</td></tr>`).join("")}</table></div>
  <div class="box"><b>Ինչու են հրաժարվում</b>${reasons.length?`<table style="margin-top:8px">${reasons.map(([k,v])=>`<tr><td>${esc(REASONS[k]||k)}</td><td>${v}</td><td>${pct(v,T.declined)}</td></tr>`).join("")}</table>`:`<p class="note">Այս ամսվա համար հրաժարումներ չկան։</p>`}</div>`;
}
function garagesView(){
  const adm=isAdmin();
  let g=D.garages.find(x=>x.id===gsel)||D.garages[0];gsel=g?.id;
  let h=adm?`<h2>Գարաժներ</h2><p class="sub">Գները պահպանվում են փոփոխելուն պես։ Ժամերը՝ «Պահպանել ժամերը» կոճակով։</p>
  <div class="chips">${D.garages.map(x=>`<button class="chip ${x.id===gsel?"on":""}" data-g="${x.id}">${esc(x.name)}</button>`).join("")}<button class="chip" id="addG">+ Նոր գարաժ</button></div>`
  :`<h2>Իմ գարաժը</h2><p class="sub">Գները պահպանվում են փոփոխելուն պես։ Ժամերը՝ «Պահպանել ժամերը» կոճակով։</p>`;
  if(!g)return h+`<div class="box">Դեռ գարաժ չկա։ Սեղմեք «+ Նոր գարաժ»։</div>`;
  h+=`<div class="box"><div class="row"><input id="gn" value="${esc(g.name)}" placeholder="Անվանում" aria-label="Անվանում"><input id="ga" value="${esc(g.address)}" placeholder="Հասցե" aria-label="Հասցե"><input id="gp" value="${esc(g.phone)}" placeholder="Հեռախոս" aria-label="Հեռախոս">
  <button class="btn" id="saveG">Պահպանել</button>${adm?`<button class="btn g" id="delG">Ջնջել գարաժը</button>`:""}</div></div>
  ${adm?`<div class="box"><b>Գարաժի մուտք</b><p class="note">${g.login?`Մուտքանուն՝ <b>${esc(g.login)}</b>։ `:"Մուտք դեռ չկա։ "}Սեփականատերը մտնում է նույն էջով՝ այս մուտքանունով և գաղտնաբառով, և տեսնում է միայն իր գարաժը և հայտերը։ Գաղտնաբառը հետո չի երևում. մոռանալու դեպքում սահմանեք նորը։</p>
  <div class="row"><input id="al" placeholder="Մուտքանուն (լատինատառ)" value="${esc(g.login||"")}" autocomplete="off"><input id="ap" type="password" placeholder="Գաղտնաբառ (նվազ. 8 նիշ)" autocomplete="new-password"><button class="btn" id="saveAcc">Պահպանել մուտքը</button>${g.login?`<button class="btn g" id="delAcc">Հանել մուտքը</button>`:""}</div></div>`:""}
  ${tgBox("garage",g.telegram_linked)}
  <div class="box tbl"><b>Ծառայություններ և գներ</b><table><tr><th>Ծառայություն</th><th>Առաջարկում է</th><th>Գին (֏)</th><th>Տևողություն (ր)</th></tr>
  ${D.services.map(s=>{const o=g.services.find(x=>x.service_id===s.id);return `<tr><td>${esc(s.name)}<div class="note">${esc(s.category)}</div></td>
  <td><input type="checkbox" data-on="${s.id}" ${o?"checked":""} aria-label="Առաջարկում է"></td>
  <td><input type="number" min="0" step="500" data-price="${s.id}" value="${o?o.price:""}" ${o?"":"disabled"}></td>
  <td><input type="number" min="5" step="5" data-dur="${s.id}" value="${o?o.duration_min:60}" ${o?"":"disabled"}></td></tr>`}).join("")}</table></div>
  <div class="box tbl"><b>Աշխատանքային ժամեր</b><table><tr><th>Օր</th><th>Բաց է</th><th>Բացում</th><th>Փակում</th></tr>
  ${DAYS.map((n,i)=>{const w=g.hours.find(x=>x.weekday===i);return `<tr><td>${n}</td><td><input type="checkbox" data-ho="${i}" ${w?"checked":""}></td><td><input type="time" data-hf="${i}" value="${w?w.open:"09:00"}"></td><td><input type="time" data-ht="${i}" value="${w?w.close:"18:00"}"></td></tr>`}).join("")}</table>
  <div style="margin-top:12px"><button class="btn" id="saveH">Պահպանել ժամերը</button></div></div>`;
  return h;
}
function catalogView(){
  return `<h2>Ծառայությունների կատալոգ</h2><p class="sub">Բանալի բառերը (ստորակետով) օգնում են chat-ի պարզ ռեժիմին հասկանալ խնդիրը։</p>
  <div class="box tbl"><table><tr><th>Անվանում</th><th>Կատեգորիա</th><th>Բանալի բառեր</th><th></th></tr>
  ${D.services.map(s=>`<tr data-sid="${s.id}"><td><input data-f="n" value="${esc(s.name)}" style="width:100%"></td><td><input data-f="c" value="${esc(s.category)}"></td><td><input data-f="k" value="${esc(s.keywords.join(", "))}" style="width:100%"></td>
  <td style="white-space:nowrap"><button class="btn" data-savs="${s.id}">Պահպանել</button> <button class="btn g" data-dels="${s.id}">Ջնջել</button></td></tr>`).join("")}</table></div>
  <div class="box"><b>Նոր ծառայություն</b><div class="row" style="margin-top:10px"><input id="cn" placeholder="Անվանում"><input id="cc" placeholder="Կատեգորիա"><input id="ck" placeholder="Բանալի բառեր"><button class="btn" id="addC">Ավելացնել</button></div></div>`;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  $("#main").innerHTML=tab==="requests"?requestsView():tab==="garages"?garagesView():tab==="report"?reportView():catalogView();
}
const kw=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
const curG=()=>D.garages.find(x=>x.id===gsel);

$("#tabs").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#out").onclick=logout;$("#go").onclick=login;$("#lg").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

$("#main").onclick=async e=>{
  const t=e.target,d=t.dataset;
  try{
    if(d.req){await api("PATCH","/requests/"+d.req,{status:d.to});await refresh();render()}
    else if(d.g){gsel=+d.g;render()}
    else if(d.tglink){
      const r=await api("POST",d.tglink==="admin"?"/telegram/link":`/garages/${gsel}/telegram/link`);
      const box=$("#tgInfo-"+d.tglink);
      box.innerHTML=(r.url?`1) <a href="${esc(r.url)}" target="_blank" rel="noopener">Բացել Telegram բոտը</a> և սեղմել <b>Start</b>։<br>`:`1) Բացեք բոտը Telegram-ում և ուղարկեք՝ <b>${esc(r.command)}</b><br>`)+
        `Եթե հղումը չի աշխատում, բոտին ուղարկեք՝ <b>${esc(r.command)}</b><br>2) Այս էջը ինքն է կթարմացվի (կոդը վավեր է 1 ժամ)։`;
      watchLink();
    }
    else if(d.tgunlink){await api("DELETE",d.tgunlink==="admin"?"/telegram":`/garages/${gsel}/telegram`);await refresh();render();toast("Telegram-ը անջատվեց")}
    else if(t.id==="saveAcc"){
      const pw=$("#ap").value;if(!$("#al").value.trim()||!pw){toast("Լրացրեք մուտքանունը և գաղտնաբառը",true);return}
      await api("PUT",`/garages/${gsel}/account`,{login:$("#al").value.trim(),password:pw});await refresh();render();toast("Մուտքը պահպանվեց")}
    else if(t.id==="delAcc"){if(armed(t,"Հանել մուտքը")){await api("DELETE",`/garages/${gsel}/account`);await refresh();render();toast("Մուտքը հանվեց")}}
    else if(t.id==="addG"){const r=await api("POST","/garages",{name:"Նոր գարաժ"});await refresh();gsel=r.id;render();toast("Գարաժը ավելացվեց")}
    else if(t.id==="saveG"){await api("PUT","/garages/"+gsel,{name:$("#gn").value.trim()||"Անանուն",address:$("#ga").value,phone:$("#gp").value});await refresh();render();toast("Պահպանվեց")}
    else if(t.id==="delG"){if(armed(t,"Ջնջել գարաժը")){await api("DELETE","/garages/"+gsel);gsel=null;await refresh();render();toast("Գարաժը ջնջվեց")}}
    else if(t.id==="saveH"){
      const days=[];for(let i=0;i<7;i++)if(document.querySelector(`[data-ho="${i}"]`).checked)days.push({weekday:i,open:document.querySelector(`[data-hf="${i}"]`).value,close:document.querySelector(`[data-ht="${i}"]`).value});
      await api("PUT",`/garages/${gsel}/hours`,{days});await refresh();toast("Ժամերը պահպանվեցին")}
    else if(t.id==="addC"){const n=$("#cn").value.trim();if(!n){$("#cn").focus();return}await api("POST","/services",{name:n,category:$("#cc").value.trim()||"Այլ",keywords:kw($("#ck").value)});await refresh();render();toast("Ծառայությունը ավելացվեց")}
    else if(d.savs){const tr=t.closest("tr");await api("PUT","/services/"+d.savs,{name:tr.querySelector('[data-f=n]').value.trim(),category:tr.querySelector('[data-f=c]').value.trim()||"Այլ",keywords:kw(tr.querySelector('[data-f=k]').value)});await refresh();toast("Պահպանվեց")}
    else if(d.dels){if(armed(t,"Ջնջել")){await api("DELETE","/services/"+d.dels);await refresh();render();toast("Ծառայությունը ջնջվեց")}}
  }catch(err){}
};
$("#main").onchange=async e=>{
  const t=e.target,d=t.dataset,g=curG();
  if(t.id==="rm"){rmonth=t.value||rmonth;R=null;render();return}
  if(d.stage){
    const rs=document.querySelector(`[data-reason="${d.stage}"]`);
    if(t.value==="declined"){rs.classList.remove("hide");rs.focus();toast("Ընտրեք հրաժարման պատճառը");return}
    rs.classList.add("hide");
    try{await api("PATCH","/requests/"+d.stage,{status:t.value});await refresh();render();toast("Փուլը պահպանվեց")}catch(err){}return}
  if(d.reason){if(!t.value)return;try{await api("PATCH","/requests/"+d.reason,{status:"declined",decline_reason:t.value});await refresh();render();toast("Փուլը պահպանվեց")}catch(err){}return}
  if(d.assign){try{await api("PUT",`/requests/${d.assign}/garage`,{garage_id:t.value?+t.value:null});await refresh();toast(t.value?"Հայտը նշանակվեց գարաժին":"Նշանակումը հանվեց")}catch(err){}return}
  if(!g)return;
  try{
    if(d.on){
      const p=document.querySelector(`[data-price="${d.on}"]`),u=document.querySelector(`[data-dur="${d.on}"]`);
      if(t.checked){p.disabled=u.disabled=false;p.focus();toast("Մուտքագրեք գինը")}
      else{await api("DELETE",`/garages/${g.id}/services/${d.on}`);p.value="";p.disabled=u.disabled=true;await refresh();toast("Ծառայությունը հանվեց")}
    }else if(d.price||d.dur){
      const sid=d.price||d.dur,p=document.querySelector(`[data-price="${sid}"]`),u=document.querySelector(`[data-dur="${sid}"]`);
      if(p.value==="")return;
      await api("PUT",`/garages/${g.id}/services/${sid}`,{price:+p.value,duration_min:+u.value||60});await refresh();toast("Գինը պահպանվեց");
    }
  }catch(err){}
};
let pollT;
function watchLink(){ // Telegram-ի կապի կարգավիճակի թարմացում, մինչև միանա
  clearInterval(pollT);let n=0;const snap=()=>D.telegram.admin_linked+"|"+D.garages.map(g=>g.telegram_linked).join();const was=snap();
  pollT=setInterval(async()=>{n++;try{await refresh()}catch(e){clearInterval(pollT);return}
    if(snap()!==was){clearInterval(pollT);render();toast("Telegram-ը միացավ ✓")}else if(n>=40)clearInterval(pollT)},3000);
}
if(token)start().catch(()=>logout());else logout();
</script>
