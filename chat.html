<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Auto Service — Chat</title>
<link rel="manifest" href="/manifest-app.webmanifest">
<meta name="theme-color" content="#1d2529">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auto Service">
<style>
:root{--bg:#e9ebec;--panel:#fff;--ink:#1d2529;--mute:#5d6a71;--line:#cfd5d8;--acc:#1f5fbf;--accink:#fff;--me:#1d2529;--meink:#fff;--star:#d99a00;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#171c1f;--panel:#222a2e;--ink:#eef1f2;--mute:#9aa7ad;--line:#38434a;--acc:#5b9bff;--accink:#0b1a30;--me:#5b9bff;--meink:#0b1a30;--star:#f2b705;--bad:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Armenian","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center}
header b{border-left:6px solid #f2b705;padding-left:10px}header{flex-wrap:wrap;gap:6px}.hr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.hr .inst{margin-left:0}
#mode{font-size:12px;color:var(--mute)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow a{background:var(--acc);color:var(--accink);text-decoration:none;border-radius:14px;padding:4px 14px;font-size:14px}.mrow .done{color:var(--mute);font-size:14px}
.inst{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:14px;padding:3px 12px;margin-left:8px}
#banner{max-width:760px;width:100%;margin:0 auto;padding:10px 18px 0}
.rb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:5px solid #f2b705;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.rb span{flex:1;min-width:180px}.rb a,.rb button{font:inherit;font-size:13px;border-radius:14px;padding:4px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.rb a{background:var(--acc);color:var(--accink);border:0}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.m{padding:10px 14px;border-radius:10px;max-width:85%;white-space:pre-wrap}
.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start}
.me{background:var(--me);color:var(--meink);align-self:flex-end}
.m.has-cards{width:min(100%,560px);max-width:100%}
.m a.lnk{color:var(--acc);word-break:break-all}
.cards{display:flex;flex-direction:column;gap:8px;margin-top:10px;white-space:normal}
.sort{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-top:8px;white-space:normal}
.sort button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:2px 10px}
.sort button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.gc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.gc .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gc .nm{font-weight:700}.gc .pr{font-weight:700;white-space:nowrap}
.gc .meta{font-size:13px;color:var(--mute);margin-top:2px}
.gc .rt{font-size:14px;margin-top:4px}.gc .rt .st{color:var(--star);font-weight:700}
.gc .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.gc button{font:inherit;font-size:14px;cursor:pointer;border-radius:8px;padding:7px 14px}
.gc .call{background:var(--acc);color:var(--accink);border:0;font-weight:600}
.gc .rev{background:transparent;color:var(--ink);border:1px solid var(--line)}
.gc .revs{margin-top:8px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.gc .revs div.one{padding:4px 0}.gc .revs .who{color:var(--mute)}
.hint{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 8px;max-width:760px;width:100%;margin:0 auto}
.hint button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:4px 12px}
.ver{text-align:center;font-size:11px;color:var(--mute);padding:2px 0 0;background:var(--panel)}
.bar{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel)}
.bar div{display:flex;gap:8px;max-width:724px;width:100%;margin:0 auto}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.bar input{flex:1}
#send{font:inherit;cursor:pointer;background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5;cursor:default}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:18px;width:min(92vw,400px)}
dialog::backdrop{background:rgba(0,0,0,.45)}dialog h3{margin:0}.for{color:var(--mute);font-size:14px;margin:2px 0 6px}
dialog label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
dialog input,dialog textarea{width:100%}
.dlgbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlgbtn button{font:inherit;cursor:pointer;border-radius:8px;padding:8px 16px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.dlgbtn .ok{background:var(--acc);color:var(--accink);border:0;font-weight:600}
#rerr{color:var(--bad);font-size:13px;margin-top:8px}.fine{font-size:12px;color:var(--mute);margin-top:10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><b>AI Auto Service</b><span class="hr"><span id="mode"></span><button id="mineBtn" class="inst" hidden>Իմ հայտերը</button><button id="newChat" class="inst">Նոր խոսակցություն</button><button id="install" class="inst" hidden>Տեղադրել հավելվածը</button></span></header>
<div id="banner"></div>
<div id="log"></div>
<div class="hint" id="hint"></div>
<div class="ver">v__APP_VERSION__</div>
<div class="bar"><div><input id="in" placeholder="Նկարագրեք մեքենայի խնդիրը…" autocomplete="off"><button id="send">Ուղարկել</button></div></div>

<dialog id="mine">
  <h3>Իմ հայտերը</h3>
  <div class="for">Այցից հետո այստեղից կարող եք գնահատել գարաժը։</div>
  <div id="mineList"></div>
  <div class="dlgbtn"><button id="mineClose">Փակել</button></div>
</dialog>

<dialog id="dlg">
  <h3>Թողնել հայտ</h3>
  <div class="for" id="dlgFor"></div>
  <label>Անուն<input id="rn" maxlength="100" autocomplete="name"></label>
  <label>Հեռախոս<input id="rp" type="tel" maxlength="25" placeholder="+374 ..." autocomplete="tel"></label>
  <label>Նշում (ցանկության դեպքում)<textarea id="rm" rows="2" maxlength="500" placeholder="Օր.՝ ցանկալի ժամը, մեքենայի մակնիշը"></textarea></label>
  <div id="rerr" role="alert"></div>
  <div class="fine">Ձեր տվյալները կստանա միայն այս գարաժը՝ ձեզ զանգահարելու համար։</div>
  <div class="dlgbtn"><button id="rcancel">Փակել</button><button class="ok" id="rsend">Ուղարկել</button></div>
</dialog>

<script>
const log=document.getElementById("log"),inp=document.getElementById("in"),btn=document.getElementById("send"),modeEl=document.getElementById("mode");
const dlg=document.getElementById("dlg"),$$=id=>document.getElementById(id);
const convo=[];let target=null;
const LOG_KEY="chat_state_v1",TTL=7*24*3600*1000;
let items=[];   // խոսակցության տեսանելի հաղորդագրությունները (պահվում են սարքում, որպեսզի հավելվածը փակելիս չջնջվեն)
const money=n=>Number(n).toLocaleString("en-US")+" ֏";
let storageOk=true;const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){storageOk=false;return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){storageOk=false}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};
function persist(){store.set(LOG_KEY,{ts:Date.now(),items:items.slice(-60),history:convo.slice(-20)})}

function ratingLine(r){
  if(!r||!r.count)return "Դեռ գնահատականներ չկան";
  return `★ ${r.avg.toFixed(1)} · ${r.count} կարծիք`+(r.count<5?" (քիչ կարծիք)":"");
}
function card(c){
  const d=document.createElement("div");d.className="gc";
  const top=document.createElement("div");top.className="top";
  const nm=document.createElement("span");nm.className="nm";nm.textContent=c.name;
  const pr=document.createElement("span");pr.className="pr";pr.textContent=money(c.price_amd);
  top.append(nm,pr);
  const meta=document.createElement("div");meta.className="meta";
  meta.textContent=`${c.address} · ${c.open_now?"բաց է հիմա":"հիմա փակ է"} · ~${c.duration_min} ր`;
  const rt=document.createElement("div");rt.className="rt";
  if(c.rating&&c.rating.count){const st=document.createElement("span");st.className="st";st.textContent="★ "+c.rating.avg.toFixed(1);
    rt.append(st,document.createTextNode(` · ${c.rating.count} կարծիք`+(c.rating.count<5?" (քիչ կարծիք)":"")))}
  else rt.textContent=ratingLine(null);
  const acts=document.createElement("div");acts.className="acts";
  const call=document.createElement("button");call.className="call";call.textContent="Թողնել հայտ";call.onclick=()=>openCall(c);
  const rev=document.createElement("button");rev.className="rev";rev.textContent="Կարծիքներ";
  const revs=document.createElement("div");revs.className="revs";revs.hidden=true;
  rev.onclick=async()=>{
    if(!revs.hidden){revs.hidden=true;return}
    revs.hidden=false;revs.textContent="Բեռնվում է…";
    try{const l=await fetch(`/garages/${c.garage_id}/reviews`).then(r=>r.json());revs.textContent="";
      if(!l.length){revs.textContent="Կարծիքներ դեռ չկան։";return}
      l.forEach(x=>{const o=document.createElement("div");o.className="one";
        const s=document.createElement("b");s.textContent="★".repeat(x.rating)+"☆".repeat(5-x.rating);s.style.color="var(--star)";
        const w=document.createElement("span");w.className="who";w.textContent=" "+(x.display_name||"Վարորդ")+" · "+x.created_at.slice(0,10);
        o.append(s,w);if(x.comment){const t=document.createElement("div");t.textContent=x.comment;o.append(t)}revs.append(o)})
    }catch(e){revs.textContent="Չհաջողվեց բեռնել։"}
  };
  acts.append(call,rev);d.append(top,meta,rt,acts,revs);return d;
}
function renderCards(box,cards,mode){
  box.textContent="";
  if(cards.length>1){
    const s=document.createElement("div");s.className="sort";s.append("Դասավորել՝ ");
    [["price","Գնով"],["rating","Գնահատականով"]].forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.className=mode===k?"on":"";b.onclick=()=>renderCards(box,cards,k);s.append(b)});
    box.append(s);
  }
  const list=[...cards].sort(mode==="rating"?(a,b)=>((b.rating.score??0)-(a.rating.score??0))||(a.price_amd-b.price_amd):(a,b)=>a.price_amd-b.price_amd);
  const wrap=document.createElement("div");wrap.className="cards";list.forEach(c=>wrap.append(card(c)));box.append(wrap);
}
function add(text,cls,cards,link,save=true){
  const d=document.createElement("div");d.className="m "+cls;
  const t=document.createElement("div");t.textContent=text;d.append(t);
  if(link){
    const p=document.createElement("div");p.style.marginTop="8px";p.append("Այցից հետո գնահատեք գարաժը այս հղումով՝ ");
    const a=document.createElement("a");a.className="lnk";a.href=link.url;a.textContent=location.origin+link.url;a.target="_blank";a.rel="noopener";p.append(a);
    const n=document.createElement("div");n.className="fine";n.textContent="Հղումը միշտ կգտնեք վերևի «Իմ հայտերը» բաժնում։";d.append(p,n);
  }
  if(cards&&cards.length){d.classList.add("has-cards");const box=document.createElement("div");d.append(box);renderCards(box,cards,"price")}
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(save){items.push({cls,text,cards:cards&&cards.length?cards:undefined,link:link||undefined});persist()}
  return d;
}
async function send(text){
  text=(text||inp.value).trim();if(!text||btn.disabled)return;
  inp.value="";$$("hint").style.display="none";
  add(text,"me");convo.push({role:"user",content:text});persist();
  btn.disabled=true;const wait=add("…","bot",null,null,false);
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:convo})});
    if(r.status===429)throw new Error("429");
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();wait.remove();add(d.reply,"bot",d.cards);convo.push({role:"assistant",content:d.reply});persist();
    modeEl.textContent=d.mode==="ai"?"AI ռեժիմ":"Պարզ ռեժիմ (առանց AI)";
  }catch(e){wait.textContent=String(e.message)==="429"?"Չափազանց շատ հարցումներ, փորձեք մի փոքր հետո։":"Սխալ՝ սերվերը չպատասխանեց։ Փորձեք նորից։";convo.pop();items.pop();persist()}
  btn.disabled=false;inp.focus();log.scrollTop=log.scrollHeight;
}

// ---- «Թողնել հայտ» ----
function openCall(c){
  target=c;$$("rerr").textContent="";$$("dlgFor").textContent=`${c.name} · ${c.service_name}`;dlg.showModal();$$("rn").focus();
}
$$("rcancel").onclick=()=>dlg.close();
$$("rsend").onclick=async()=>{
  const body={name:$$("rn").value.trim(),phone:$$("rp").value.trim(),message:$$("rm").value.trim(),garage_id:target.garage_id,service_id:target.service_id};
  if(!body.name||body.phone.length<6){$$("rerr").textContent="Լրացրեք անունը և հեռախոսը։";return}
  $$("rsend").disabled=true;
  try{
    const r=await fetch("/requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===429){$$("rerr").textContent="Չափազանց շատ հայտեր, փորձեք ավելի ուշ։";return}
    if(!r.ok){$$("rerr").textContent="Ստուգեք հեռախոսի համարը (թվեր, +, -, փակագծեր)։";return}
    const d=await r.json();dlg.close();["rn","rp","rm"].forEach(i=>$$(i).value="");
    add(`Հայտը ուղարկված է «${d.garage||target.name}»-ին։ Նրանք կզանգահարեն ձեզ։`,"bot",null,d.review_url?{url:d.review_url}:null);
    if(d.review_url){
      const l=store.get("pending_reviews",[]);l.push({url:d.review_url,garage:d.garage||target.name,ts:Date.now(),done:false});
      store.set("pending_reviews",l.slice(-20));refreshMine();writeHash();
      if(!storageOk)warnStorage();
    }
    log.scrollTop=log.scrollHeight;
  }catch(e){$$("rerr").textContent="Սերվերը չպատասխանեց։"}
  finally{$$("rsend").disabled=false}
};

// ---- Հիշեցում. «Գնացի՞ք» (նույն դիտարկչում, առանց արտաքին ծանուցման) ----
function warnStorage(){
  if($$("banner").querySelector(".stwarn"))return;
  const d=document.createElement("div");d.className="rb stwarn";
  const s=document.createElement("span");s.textContent="Դիտարկիչը չի թույլատրում պահել տվյալներ (հնարավոր է՝ private ռեժիմ). խոսակցությունը կկորչի թարմացնելիս։ Գնահատման հղումը կպահվի հասցեագոտում, բայց լավագույնն է պատճենել այն։";
  d.append(s);$$("banner").prepend(d);
}
function banner(){
  const after=store.get("remind_after_ms",4*3600*1000),box=$$("banner");box.querySelectorAll(".rb:not(.stwarn)").forEach(e=>e.remove());
  store.get("pending_reviews",[]).filter(x=>!x.done&&!x.dismissed&&Date.now()-x.ts>=after).slice(0,2).forEach(x=>{
    const d=document.createElement("div");d.className="rb";
    const s=document.createElement("span");s.textContent=`Դուք հայտ թողեցիք «${x.garage}»-ին։ Գնացի՞ք։ Կիսվեք փորձով։`;
    const a=document.createElement("a");a.href=x.url;a.textContent="Գնահատել";
    const c=document.createElement("button");c.textContent="Փակել";c.onclick=()=>{store.set("pending_reviews",store.get("pending_reviews",[]).map(y=>y.url===x.url?{...y,dismissed:true}:y));banner()};
    d.append(s,a,c);box.append(d);
  });
}

// ---- Իմ հայտերը ----
const mineBtn=$$("mineBtn");
function myReqs(){const cut=Date.now()-90*86400000;return store.get("pending_reviews",[]).filter(x=>x.ts>cut)}
const tokOf=u=>String(u).split("/").filter(Boolean).pop();
function hashTokens(){const m=location.hash.match(/[#&]h=([A-Za-z0-9_,-]*)/);return m?m[1].split(",").filter(Boolean):[]}
function writeHash(){ // հղումների պահուստը հասցեագոտում. refresh-ից հետո մնում է, նույնիսկ եթե դիտարկիչը արգելում է պահոցը
  const t=myReqs().filter(x=>!x.done).map(x=>tokOf(x.url)).slice(-5);
  try{window.history.replaceState(null,"",location.pathname+location.search+(t.length?"#h="+t.join(","):""))}catch(e){}
}
async function recoverFromHash(){ // եթե պահոցը դատարկ է, բայց հասցեում կան հղումներ՝ վերականգնում ենք «Իմ հայտերը»
  const known=new Set(myReqs().map(x=>tokOf(x.url)));let changed=false;const l=store.get("pending_reviews",[]);
  for(const t of hashTokens()){
    if(known.has(t))continue;
    try{const r=await fetch("/review-info/"+encodeURIComponent(t));if(!r.ok)continue;const d=await r.json();
      l.push({url:"/review/"+t,garage:d.garage||"Գարաժ",ts:Date.now(),done:!!d.already_reviewed});changed=true}catch(e){}
  }
  if(changed){store.set("pending_reviews",l.slice(-20));refreshMine()}
}
function refreshMine(){const l=myReqs();mineBtn.hidden=!l.length;const n=l.filter(x=>!x.done).length;mineBtn.textContent="Իմ հայտերը"+(n?` (${n})`:"")}
mineBtn.onclick=()=>{
  const box=$$("mineList");box.textContent="";
  [...myReqs()].reverse().forEach(x=>{
    const r=document.createElement("div");r.className="mrow";
    const s=document.createElement("span");s.textContent=`${x.garage} · ${new Date(x.ts).toLocaleDateString("en-GB")}`;r.append(s);
    if(x.done){const k=document.createElement("span");k.className="done";k.textContent="✓ Գնահատված";r.append(k)}
    else{const a=document.createElement("a");a.href=x.url;a.textContent="Գնահատել";r.append(a)}
    box.append(r);
  });
  $$("mine").showModal();
};
$$("mineClose").onclick=()=>$$("mine").close();
let armedNew=false;
$$("newChat").onclick=e=>{   // «Իմ հայտերը»-ը չի ջնջվում, միայն խոսակցությունը
  if(items.length&&!armedNew){armedNew=true;e.target.textContent="Հաստատե՞լ";setTimeout(()=>{armedNew=false;e.target.textContent="Նոր խոսակցություն"},3500);return}
  store.del(LOG_KEY);location.reload();
};
function restore(){   // վերականգնում ենք վերջին խոսակցությունը (մինչև 7 օր)
  const st=store.get(LOG_KEY,null);
  if(!st||!st.items||!st.items.length||Date.now()-st.ts>TTL)return false;
  convo.push(...(st.history||[]));items=st.items;
  let orphan=null;   // էջը թարմացվել է պատասխանի սպասման ժամանակ. վերջին հարցը պատասխան չունի
  if(items.length&&items[items.length-1].cls==="me"){orphan=items.pop().text;if(convo.length&&convo[convo.length-1].role==="user")convo.pop();persist()}
  st.items.forEach(i=>add(i.text,i.cls,i.cards,i.link,false));$$("hint").style.display="none";
  if(orphan){inp.value=orphan;add("Նախորդ հարցի պատասխանը չստացվեց (էջը թարմացվել է)։ Հարցը վերադարձվել է մուտքի դաշտ՝ ուղարկեք նորից։","bot",null,null,false)}
  return true;
}
if(!restore())add("Բարև։ Նկարագրեք մեքենայի խնդիրը, և ես կգտնեմ համապատասխան ծառայությունը ու գարաժը։","bot",null,null,false);
["Արգելակելիս ճռռոց է լսվում","Օդորակիչը չի սառեցնում","Ո՞ր գարաժն է հիմա բաց"].forEach(t=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>send(t);$$("hint").appendChild(b)});
btn.onclick=()=>send();inp.addEventListener("keydown",e=>{if(e.key==="Enter")send()});
banner();refreshMine();recoverFromHash().then(writeHash);if(!storageOk)warnStorage();

// ---- Տեղադրվող հավելված (PWA) ----
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
let deferredInstall=null;const inst=$$("install");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;inst.hidden=false});
inst.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;inst.hidden=true};
addEventListener("appinstalled",()=>{inst.hidden=true});
(function iosHint(){ // iOS-ում «Տեղադրել» կոճակ չկա. ցույց ենք տալիս քայլերը
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(!ios||standalone||store.get("ios_hint_dismissed",false))return;
  const d=document.createElement("div");d.className="rb";
  const s=document.createElement("span");s.textContent="Տեղադրեք հավելվածը. Safari-ում սեղմեք «Share» (կիսվել), ապա «Add to Home Screen»։";
  const c=document.createElement("button");c.textContent="Փակել";c.onclick=()=>{store.set("ios_hint_dismissed",true);d.remove()};
  d.append(s,c);$$("banner").append(d);
})();
