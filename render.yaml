# Render Blueprint. անվճար դեմո (web-ը քնում է 15 րոպե անգործությունից հետո)։
# Բազան՝ Render Postgres. անվճար պլանը 30 օր հետո ջնջվում է, իրական գարաժի համար վերցրեք վճարովին։
databases:
  - name: ai-auto-service-db
    plan: free
    databaseName: autoservice
    user: autoservice

services:
  - type: web
    name: ai-auto-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SEED_SAMPLE          # 1՝ ամեն սկսելիս նմուշային գարաժներ (դեմոյի համար)
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: ai-auto-service-db
          property: connectionString
      - key: AI_DAILY_LIMIT
        value: "100"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD       # Render-ը կհարցնի ստեղծելիս
        sync: false
      - key: NOMINATIM_CONTACT    # ձեր էլ. փոստը՝ հասցեի որոնման համար (OSM-ի կանոն)
        sync: false
